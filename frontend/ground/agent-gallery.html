<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labourious — Agent Roster (deskrpg-exact)</title>

  <!-- Inline SVG favicon (same as index.html). -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%238b8378'/><rect x='5' y='6' width='6' height='2' fill='%23d4af37'/></svg>" />

  <!-- Press Start 2P — same pixel chrome as the ground lobby prototype. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />

  <!-- Shared roster styles. -->
  <link rel="stylesheet" href="./assets/agents/agent-cards.css" />
</head>
<body>
  <header>
    <h1>LABOURIOUS · AGENT ROSTER</h1>
    <p>standstill · facing down · 64×64 frame ×4</p>
    <p class="src">LPC composites, ported 1:1 from deskrpg src/lib/sprite-compositor.ts</p>
  </header>
  <div id="roster"><div class="error">Loading…</div></div>

  <script type="module">
    import { appendAgentCard, loadManifest, roomTitle, showError } from "./assets/agents/agent-cards.js";

    const roster = document.getElementById("roster");
    try {
      const agents = await loadManifest();
      roster.textContent = "";

      // Group cards by room, preserving manifest order.
      const byRoom = new Map();
      for (const agent of agents) {
        if (!byRoom.has(agent.room)) byRoom.set(agent.room, []);
        byRoom.get(agent.room).push(agent);
      }
      for (const [room, list] of byRoom) {
        const h = document.createElement("h2");
        h.className = "room-title";
        h.textContent = roomTitle(room);
        roster.appendChild(h);
        for (const agent of list) await appendAgentCard(roster, agent);
      }
    } catch (err) {
      showError(roster, err);
    }
  </script>
</body>
</html>
