<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labourious — Research · Room 1 (deskrpg-exact)</title>

  <!-- Inline SVG favicon (same as index.html). -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%238b8378'/><rect x='5' y='6' width='6' height='2' fill='%23d4af37'/></svg>" />

  <!-- Press Start 2P — same pixel chrome as the ground lobby prototype. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ffffff; /* user asked: pure white background */
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #2a3340;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 64px;
      box-sizing: border-box;
    }
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      color: #6b4226;
      letter-spacing: 1px;
      margin: 0 0 10px;
    }
    header p {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      line-height: 1.8;
      color: #2a3340;
      margin: 0;
    }
    header .src {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: #8a94a0;
      margin-top: 10px;
    }
    #roster {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px;
      max-width: 1200px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 16px;
      background: #ffffff;
      border: 1px solid #e3e6ea;
      border-radius: 6px;
      box-shadow: 0 10px 30px -18px rgba(20, 30, 50, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 22px 44px -18px rgba(20, 30, 50, 0.45);
      border-color: #d4af37;
    }
    .card.lead {
      border: 2px solid #d4af37;
      box-shadow: 0 10px 34px -16px rgba(212, 175, 55, 0.55);
    }
    .card .badge {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      letter-spacing: 1px;
      color: #6b4226;
      background: #f6ead0;
      border: 1px solid #d4af37;
      border-radius: 3px;
      padding: 4px 8px;
    }
    .card canvas {
      display: block;
      background: #ffffff;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .card .name {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #2a3340;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .card .role {
      font-size: 11px;
      font-weight: 600;
      color: #6b4226;
      text-align: center;
    }
    .card .look {
      font-size: 11px;
      color: #8a94a0;
      text-align: center;
      max-width: 240px;
    }
    .error {
      font-size: 13px;
      color: #b33636;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body>
  <header>
    <h1>RESEARCH · ROOM 1</h1>
    <p>ground floor · intake · lead: michael burry</p>
    <p class="src">standstill · facing down · 64×64 frame ×4 · LPC composites ported 1:1 from deskrpg</p>
  </header>
  <div id="roster"><div class="error">Loading…</div></div>

  <script type="module">
    import { compositeCharacter, drawStandstill, FRAME_WIDTH } from "./assets/agents/agent-compositor.js";

    const SCALE = 4; // frame × 4 = 256 px per card
    const SIZE  = FRAME_WIDTH * SCALE;

    const roster = document.getElementById("roster");
    roster.textContent = "";

    let agents;
    try {
      agents = await (await fetch("/assets/agents/agents.json")).json();
    } catch (err) {
      const el = document.createElement("div");
      el.className = "error";
      el.textContent = "Failed to load agent roster: " + err.message;
      roster.appendChild(el);
    }

    for (const agent of (agents ?? []).filter((a) => a.room === "research")) {
      const card = document.createElement("div");
      card.className = "card" + (agent.lead ? " lead" : "");

      const canvas = document.createElement("canvas");
      canvas.width  = SIZE;
      canvas.height = SIZE;

      const sheet = document.createElement("canvas");
      await compositeCharacter(sheet, agent.layers);
      drawStandstill(canvas, sheet, { scale: SCALE });

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = agent.name.toUpperCase();

      const role = document.createElement("div");
      role.className = "role";
      role.textContent = agent.role;

      const look = document.createElement("div");
      look.className = "look";
      look.textContent = agent.look;

      if (agent.lead) {
        const badge = document.createElement("div");
        badge.className = "badge";
        badge.textContent = "★ LEAD";
        card.insertBefore(badge, card.firstChild);
      }

      card.append(canvas, name, role, look);
      roster.appendChild(card);
    }
  </script>
</body>
</html>
